apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: config-worker
  description: Cloudflare Worker for the Config read-only API surface
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/config-worker
  dependsOn:
    - component: membership-worker
    - component: policy-worker
  # Runtime secrets, wire-now-seed-later: best-effort references —
  # an unseeded key is skipped at resolve (and by secrets-live), so
  # this block is inert until the value is stored in orun secrets.
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ws_EVPG35GG/meterwise/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ws_EVPG35GG/meterwise/prod/WIRING_CLOUDFLARE_D1"

  optionalSecretEnv:
    SECRET_ENCRYPTION_KEY: "secret://ws_EVPG35GG/meterwise/{{ .environment }}/SECRET_ENCRYPTION_KEY"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: meterwise

    # Runtime worker secrets, pushed by the secrets-live step from the
    # values orun resolves for the optionalSecretEnv references below.
    runtimeSecrets: "SECRET_ENCRYPTION_KEY"
    turboFilter: "@saas/config-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-d1"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/config-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/config-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    # Safety net: ensure the secrets-at-rest encryption key exists on every
    # deploy target before the worker ships. Generate-if-missing, idempotent —
    # `wrangler secret list` is the existence probe; the key is generated in
    # CI, pushed straight to Cloudflare, and never logged or persisted
    # elsewhere. The MANAGED path is orun secrets: seed SECRET_ENCRYPTION_KEY
    # (escrow the CURRENTLY DEPLOYED value — a fresh key bricks stored data)
    # and the secrets-live step keeps the worker in sync; this pre-deploy
    # probe then always finds the key present and does nothing. Remove it
    # once the key is seeded in orun.
    preDeployCommand: |
      for e in stage prod; do
        if ! pnpm exec wrangler secret list --config wrangler.jsonc --env "$e" 2>/dev/null | grep -q '"SECRET_ENCRYPTION_KEY"'; then
          echo "Provisioning SECRET_ENCRYPTION_KEY for env $e"
          openssl rand -hex 32 | pnpm exec wrangler secret put SECRET_ENCRYPTION_KEY --config wrangler.jsonc --env "$e"
        else
          echo "SECRET_ENCRYPTION_KEY already present for env $e"
        fi
      done
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: config
    runtime: cloudflare
# ci: re-trigger deploy (batch B — membership-dependents, 20260622T140838Z)
# orun: redeploy 04-workers 20260924T003405Z
